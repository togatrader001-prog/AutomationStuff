            - link "Posts on X" [ref=f1e2068] [cursor=pointer]:
              - /url: https://x.com/QuintonLucasKC/status/2097797157860573382
          - generic [ref=f1e2070]:
            - generic [ref=f1e2071]:
              - link "View this post on X" [ref=f1e2072] [cursor=pointer]:
                - /url: https://x.com/GovMikeKehoe/status/2098139041455583437
              - generic [ref=f1e2075]:
                - generic [ref=f1e2076]: Governor Mike Kehoe
                - generic [ref=f1e2077]: "@GovMikeKehoe"
              - generic [ref=f1e2078]: While the reasoning behind today’s Missouri Supreme Court contempt hearings remain questionable, I am proud to stand behind Secretary Hoskins as he continues to serve as Missouri’s top elections authority. I look forward to the Eighth Circuit’s consideration of the merits of the Missouri First Map and remain confident in the legal process moving forward. Voters deserve certainty and clarity.
              - generic [ref=f1e2079]:
                - generic [ref=f1e2080]: Posted on X
                - time [ref=f1e2083]: • 9/10/26 3:58 PM
            - generic [ref=f1e2084]:
              - link "View this post on X" [ref=f1e2085] [cursor=pointer]:
                - /url: https://x.com/GovMikeKehoe/status/2097461823473660024
              - generic [ref=f1e2088]:
                - generic [ref=f1e2089]: Governor Mike Kehoe
                - generic [ref=f1e2090]: "@GovMikeKehoe"
              - generic [ref=f1e2091]: We are grateful for Chief Judge Clark’s decision to provide much-needed clarity for Missouri voters and the election process. With today marking the deadline for changes to the November ballot, the Missouri First Map will be used in the general election. Voters and candidates deserve consistency, certainty, and not to have the rules changed between elections.
              - generic [ref=f1e2092]:
                - generic [ref=f1e2093]: Posted on X
                - time [ref=f1e2096]: • 9/8/26 7:07 PM
            - generic [ref=f1e2097]:
              - link "View this post on X" [ref=f1e2098] [cursor=pointer]:
                - /url: https://x.com/QuintonLucasKC/status/2098055794180948088
              - generic [ref=f1e2101]:
                - generic [ref=f1e2102]: Mayor Q
                - generic [ref=f1e2103]: "@QuintonLucasKC"
              - generic [ref=f1e2104]: "Chaos in Missouri while statewide GOP leaders trying to render us voiceless. On tap today: -Contempt hearing for the MO Secretary of State -US Supreme Court decision on whether to let us vote on the original maps. pic.x.com/rrWaMYYloo"
              - generic [ref=f1e2105]:
                - generic [ref=f1e2106]: Posted on X
                - time [ref=f1e2109]: • 9/10/26 10:27 AM
            - generic [ref=f1e2110]:
              - link "View this post on X" [ref=f1e2111] [cursor=pointer]:
                - /url: https://x.com/QuintonLucasKC/status/2097797157860573382
              - generic [ref=f1e2114]:
                - generic [ref=f1e2115]: Mayor Q
                - generic [ref=f1e2116]: "@QuintonLucasKC"
              - generic [ref=f1e2117]: The question now before us is whether the US Supreme Court stands by Justice Kavanaugh’s earlier rejection of Missouri’s arguments—yesterday. The independence of our courts, our elections, and our state laws is at stake. Shame on those forcing constitutional crisis upon us.
              - generic [ref=f1e2118]:
                - generic [ref=f1e2119]: Posted on X
                - time [ref=f1e2122]: • 9/9/26 5:19 PM
            - link "View on X" [ref=f1e2125] [cursor=pointer]:
